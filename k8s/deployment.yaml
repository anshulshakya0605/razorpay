apiVersion: apps/v1
kind: Deployment
metadata:
name: razorpay
namespace: razorpay
spec:
replicas: 2
selector:
matchLabels:
app: razorpay
strategy:
type: RollingUpdate
template:
metadata:
labels:
app: razorpay
spec:
containers:
- name: razorpay
image: asia-south2-docker.pkg.dev/PROJECT_ID/springboot-repo/razorpay:IMAGE_TAG
imagePullPolicy: Always
ports:
- containerPort: 8080
resources:
requests:
cpu: "250m"
memory: "512Mi"
limits:
cpu: "500m"
memory: "1Gi"
readinessProbe:
httpGet:
path: /actuator/health
port: 8080
initialDelaySeconds: 20
periodSeconds: 10
livenessProbe:
httpGet:
path: /actuator/health
port: 8080
initialDelaySeconds: 40
periodSeconds: 20